# 關閉 bridge netfilter —— 副 gw 的 client 才拿得到 IP。
#
# ⚠️ 真兇: Docker 安裝時會放 /etc/sysctl.d/12-br-netfilter-ip.conf
#    ("enable bridge firewalling for docker") 把這兩項設成 1, 覆蓋掉
#    OpenWrt 預設的 11-br-netfilter.conf(=0)。一旦設 1, br_netfilter
#    就把「橋接」的封包也送進 iptables/nftables 過濾, 副 gw 要幫下游
#    client 轉發到主 gw 的 DHCP 廣播(UDP 67)就被防火牆丟掉。
#
# 症狀: client 連上副 gw 後卡在「取得 IP」/「沒有網路連線」, 漫遊回主 gw
#    就正常。⚠️ 重開機與 /etc/init.d/network restart 都修不好(是設定不是
#    狀態), 很容易誤判成 bridge/STP/漫遊門檻的問題。
#
# ★ 實測(2026-09-09, .4 RAX3000M 副gw, 同時抓 phy1-ap0 與 lan3):
#      設 1 時: client 送進來 19 筆 -> lan3 送出 0 筆
#      設 0 後: client 送進來 39 筆 -> lan3 送出 21 筆, 且看得到
#               "192.168.1.1.67 > 192.168.1.110.68 BOOTP/DHCP, Reply"
#    ⚠️ STP/ARP 不受影響(ARP 走 arptables, 該項本來就是 0), 所以現象是
#      「其他廣播都通、只有 DHCP 不通」, 極易誤導。
#
# 對 Docker 的影響: 實測無。容器走 docker0 不走 br-lan, OpenList 容器
#    正常、API HTTP 200、對外連線正常。
#
# 檔名 99- 是為了排在 12-br-netfilter-ip.conf 之後蓋過它。
net.bridge.bridge-nf-call-iptables=0
net.bridge.bridge-nf-call-ip6tables=0
